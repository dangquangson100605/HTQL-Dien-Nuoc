{% extends "base.html" %}
{% load static %}

{% block title %}Đăng nhập · Hạ tầng điện nước{% endblock %}

{% block body %}
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <span class="navbar-brand mb-0 h1">Quản lý hạ tầng</span>
  </div>
</nav>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h2 class="h4 mb-3 text-center">Đăng nhập</h2>
          <p class="text-muted small text-center mb-4">Sử dụng tài khoản được cấp để vào bản đồ và danh sách thiết bị.</p>
          <div id="login-alert" class="alert alert-danger py-2 small d-none" role="alert"></div>
          <form id="login-form" novalidate>
            <div class="mb-3">
              <label for="username" class="form-label">Tên đăng nhập</label>
              <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Mật khẩu</label>
              <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100" id="login-submit">Đăng nhập</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/login.js' %}?v=3"></script>
{% endblock %}
